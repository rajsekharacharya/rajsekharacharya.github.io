<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>404 | System Error</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050505;
      color: #00ff41;
      font-family: monospace;
    }

    .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body class="h-screen flex items-center justify-center p-4 text-center">
  <div>
    <h1 class="text-6xl font-bold mb-4">404</h1>
    <p class="text-xl mb-8">Error: Resource not found in memory.</p>
    <div class="bg-gray-900 border border-gray-800 p-4 inline-block text-left rounded mb-8">
      <span class="text-blue-400">user@system</span>:~$ check_url<br>
      <span class="text-red-500">[ERROR]</span> Path does not map to any known inode.<br>
      <span class="text-blue-400">user@system</span>:~$ <span class="cursor"></span>
    </div>
    <br>
    <a href="/"
      class="px-6 py-3 border border-[#00ff41] text-[#00ff41] hover:bg-[#00ff41] hover:text-black font-bold uppercase transition-all">
      Return_Home
    </a>
  </div>
</body>

</html>
