<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Rajsekhar Acharya</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --text: #ededee;
      --muted: #9a9aa3;
      --accent: #ff6a3d;
      --accent-ink: #0a0a0b;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f8;
        --text: #0f0f11;
        --muted: #5b5b64;
        --accent: #c2370a;
        --accent-ink: #fff;
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 "Bricolage Grotesque", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 520px; }

    .code {
      font-size: clamp(5rem, 22vw, 10rem);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 0.9;
      color: var(--accent);
    }

    h1 {
      margin: 24px 0 8px;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    p { margin: 0 0 32px; color: var(--muted); }

    a {
      display: inline-flex;
      align-items: center;
      height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      text-decoration: none;
      transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    a:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a href="/">Back to portfolio</a>
  </main>
</body>

</html>
